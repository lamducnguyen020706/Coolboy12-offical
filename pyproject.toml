# COOLBOY12 — Artifact 005 · pyproject.toml · P0/0b
#
# Scope is Artifact 005 only. Later artifacts own: 006 dependency lockfile ·
# 007 test runner config · 008 linter/formatter config · 009 editor config ·
# 010 test suite scaffolding.
#
# Resolution of the three previously unsourced values, after searching the
# Blueprint, the RMS, the Roadmap, Artifact 003, CLAUDE.md and the repository.
# Recorded in the Revolving Resolution Note at GAP-E:
#
#   requires-python  RULED BY THE AUTHOR: >=3.11. The word "python" appears
#                    in none of the three authoritative documents, so this is
#                    a ruling, not a derivation. It is required for Artifact
#                    006 to lock deterministically: without it the resolver
#                    takes the floor from whichever interpreter the
#                    environment offers. Recorded at GAP-E.3.a.
#
#   build backend    UNRESOLVED. No source names a build system; every
#                    occurrence of "wheel" in the sources is "flywheel".
#                    [build-system] is therefore OMITTED. PEP 517's documented
#                    fallback applies and the package still builds.
#
#   version          RULED BY THE AUTHOR: 0.0.0. [project] must carry a
#                    version for this file to resolve or build, and no source
#                    establishes one. The Blueprint's v0.7.0 is the version of
#                    that document, not of this package, and the two are not
#                    connected by any source. 0.0.0 is an author ruling, not a
#                    derivation. Recorded in the Revolving Resolution Note at
#                    GAP-E.3.
#
# name and dependencies are derived from source: the Blueprint states the
# system name "coolboy12", Artifact 001 establishes src/coolboy12/, and the
# Artifact 005 manifest entry declares no dependency.

[project]
name = "coolboy12"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

# Package discovery, so this file matches the tree Artifact 001 built.
# Targets the same backend PEP 517 falls back to when [build-system] is absent.
[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

# ---------------------------------------------------------------------------
# Artifact 007 · test runner configuration · P0/0b · R: VALID · SoT: DEV-ENV
#
# No authoritative source names a test runner; the only "test runner" string in
# the three documents is artifact 007's own manifest name. pytest is an author
# ruling, recorded at GAP-G in the Revolving Resolution Note. It is DEV-ENV
# tooling and carries no coolboy12 semantic authority (Blueprint P-31).
#
# pytest is declared in a dev dependency group, not in [project.dependencies]:
# runtime dependencies stay empty, as Artifact 005 declares. It is left
# unconstrained here so that Artifact 006 (uv.lock) does the pinning, which is
# what a lockfile is for, rather than this file inventing a version floor.
#
# testpaths names the root Artifact 001 already built. The seven suites are
# Artifact 010's responsibility and are not created here.
# ---------------------------------------------------------------------------

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Artifact 008 · linter / formatter configuration · P0/0b · R: VALID · SoT: DEV-ENV
#
# No authoritative source names a Python linter or formatter. ruff is an author
# ruling, recorded at GAP-H. It is one tool covering both roles, so no second
# competing linter or formatter is introduced.
#
# NOT the Blueprint's "linter". Blueprint §12 describes coolboy12's own
# structural-validation linter — "linter findings block ... deliberately dumb
# and deliberately fast". That is a coolboy12 semantic mechanism owned by the
# P4 validation artifacts (125-144). ruff is DEV-ENV tooling and carries no
# coolboy12 semantic authority (Blueprint P-31).
#
# Deliberately minimal, and deliberately NOT duplicating values that already
# exist elsewhere:
#   target-version  not set. ruff derives it from [project].requires-python,
#                   so pinning it here would duplicate Artifact 005 and drift
#                   if that floor is ever re-ruled.
#   version floor   not set. Artifact 006 (uv.lock) pins the concrete version.
#   exclusions      not set. ruff already excludes .venv, .git, __pycache__,
#                   build and dist by default; a hand-written list would be
#                   larger and no more correct.
#   rule selection  ruff's default rule set, pinned by the lockfile.
# ---------------------------------------------------------------------------

[tool.ruff]
